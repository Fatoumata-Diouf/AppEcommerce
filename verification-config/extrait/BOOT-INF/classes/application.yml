
spring:
  application:
    name: CONFIG-SERVER

  profiles:
    active: native


  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
