name: CI/CD Commande Service

on:
  push:
    branches:
      - main
    paths:
      - 'commande-service/**'
      - '.github/workflows/commande-service.yml'

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven
        working-directory: ./commande-service
        run: mvn clean package -DskipTests

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construire l'image Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/commande-service:latest ./commande-service

      - name: Publier l'image Docker
        run: docker push ${{ secrets.DOCKER_USERNAME }}/commande-service:latest