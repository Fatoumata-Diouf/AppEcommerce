
services:

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  client-service:
    build: ./client-service
    container_name: client-service
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
    networks:
      - microservices-net

  produit-service:
    build: ./produit-service
    container_name: produit-service
    ports:
      - "8083:8083"
    depends_on:
      - discovery-service
    networks:
      - microservices-net

  commande-service:
    build: ./commande-service
    container_name: commande-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
      - client-service
      - produit-service
    networks:
      - microservices-net

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
      - client-service
      - produit-service
      - commande-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge