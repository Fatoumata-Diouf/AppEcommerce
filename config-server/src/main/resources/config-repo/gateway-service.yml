server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/clients/**

        - id: produit-service
          uri: lb://produit-service
          predicates:
            - Path=/produits/**

        - id: commande-service
          uri: lb://commande-service
          predicates:
            - Path=/commandes/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

# Proprietes metier RAFRAICHISSABLES a chaud
library:
  max-loan-days: 14
  late-fee-per-day: 50
  welcome-message: "Bienvenue dans la page de passarelle"

security:
  jwt:
    # ATTENTION : Cette clé DOIT être exactement la même que celle configurée dans votre auth-service
    secret: "ISI-Master2-2026-TP-Microservices-JWT-Shared-Secret-Change-Me"