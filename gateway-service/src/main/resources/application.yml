
spring:
  application:
    name: gateway-service

  config:
    import: "configserver:http://config-server:8888"
  cloud:
    config:
      fail-fast: false           # crash si config-server KO
      retry: # retry si config-server lent
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
