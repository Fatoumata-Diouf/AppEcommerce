server:
  port: 8082


spring:
  application:
    name: COMMANDE-SERVICE


  datasource:
    url: jdbc:postgresql://postgres:5432/commandedb
    username: admin
    password: passer
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


  h2:
    console:
      enabled: true


eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

  instance:
    prefer-ip-address: true
